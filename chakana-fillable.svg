<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  width="120mm" height="120mm" viewBox="0 0 120 120" version="1.1">

  <defs>
    <!-- Chakana shape as a clipPath — drop your image inside the <clipPath> group -->
    <clipPath id="chakana-clip">
      <path d="M38,0 L82,0 L82,18 L100,18 L100,38 L120,38 L120,82 L100,82 L100,100 L82,100 L82,120 L38,120 L38,100 L20,100 L20,82 L0,82 L0,38 L20,38 L20,18 L38,18 Z"/>
    </clipPath>
  </defs>

  <!-- INSTRUCTION COMMENT: Replace the rect below with your <image> element.
       The image will be clipped to the Chakana shape automatically.
       Example:
         <image href="your-print-pattern.jpg" x="0" y="0" width="120" height="120"
                clip-path="url(#chakana-clip)" preserveAspectRatio="xMidYMid slice"/>
  -->

  <!-- Placeholder fill — replace this with your image -->
  <rect x="0" y="0" width="120" height="120"
    fill="#d2bbb2" clip-path="url(#chakana-clip)"/>

  <!-- Chakana outline over the image -->
  <path d="M38,0 L82,0 L82,18 L100,18 L100,38 L120,38 L120,82 L100,82 L100,100 L82,100 L82,120 L38,120 L38,100 L20,100 L20,82 L0,82 L0,38 L20,38 L20,18 L38,18 Z"
    fill="none" stroke="#0d2b30" stroke-width="1.2" stroke-linejoin="miter"/>

  <!-- Center void circle — keeps the sacred geometry -->
  <circle cx="60" cy="60" r="10" fill="#fdfcfa" stroke="#0d2b30" stroke-width="0.8"/>

  <!-- Usage note (will not print) -->
  <text x="60" y="135" text-anchor="middle"
    font-family="Cinzel,Georgia,serif" font-size="3" fill="#9a8a82">Replace fill rect with your image element</text>

</svg>